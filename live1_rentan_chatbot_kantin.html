<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LIVE-1 Web Dummy Rentan · Chatbot Kantin (Direct Injection)</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --accent-danger: #ef4444;
      --text-color: #f8fafc;
      --text-muted: #94a3b8;
      --border-color: #334155;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }
    body { background-color: var(--bg-color); color: var(--text-color); padding: 2rem; min-height: 100vh; display: flex; justify-content: center; }
    .container { width: 100%; max-width: 800px; display: flex; flex-direction: column; gap: 1.5rem; }
    .header { background: var(--card-bg); padding: 1.5rem; border-radius: 12px; border: 1px solid var(--border-color); display: flex; justify-content: space-between; align-items: center; }
    .badge { background: var(--accent-danger); color: #fff; padding: 0.25rem 0.75rem; border-radius: 20px; font-size: 0.85rem; font-weight: bold; }
    .chat-box { background: var(--card-bg); border-radius: 12px; border: 1px solid var(--border-color); padding: 1.5rem; height: 350px; overflow-y: auto; display: flex; flex-direction: column; gap: 1rem; }
    .msg { padding: 0.75rem 1rem; border-radius: 8px; max-width: 80%; line-height: 1.5; }
    .msg.user { background: #3b82f6; align-self: flex-end; }
    .msg.asisten { background: #334155; align-self: flex-start; }
    .input-area { display: flex; gap: 0.5rem; }
    input[type="text"] { flex: 1; background: var(--card-bg); border: 1px solid var(--border-color); color: var(--text-color); padding: 0.75rem 1rem; border-radius: 8px; }
    button { background: #3b82f6; color: white; border: none; padding: 0.75rem 1.5rem; border-radius: 8px; cursor: pointer; font-weight: bold; }
    button:hover { opacity: 0.9; }
    .config-panel { background: rgba(30, 41, 59, 0.5); padding: 1rem; border-radius: 8px; border: 1px dashed var(--border-color); font-size: 0.9rem; color: var(--text-muted); }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <div>
        <h2>Chatbot Kantin (Versi Rentan)</h2>
        <p style="color: var(--text-muted); font-size: 0.9rem;">Skenario LIVE-1: Prompt Injection Langsung</p>
      </div>
      <span class="badge">RENTAN</span>
    </div>

    <div class="config-panel">
      <label>API Key LLM (Opsional untuk pengujian mandiri):</label>
      <input type="text" id="api-key-input" placeholder="Isikan API Key jika testing langsung..." style="width: 100%; margin-top: 0.5rem;">
    </div>

    <div class="chat-box" id="chatHistory">
      <div class="msg asisten">Halo! Saya asisten Kantin. Silakan tanya menu dan harga makanan hari ini.</div>
    </div>

    <div class="input-area">
      <input type="text" id="userInput" placeholder="Ketik pesan untuk Kantin...">
      <button onclick="kirimPesan()">Kirim</button>
    </div>
  </div>

  <script>
    // FUNGSI UTAMA SESUAI SPESIFIKASI EVALUATOR
    window.asisten = async function(pesan, konteks, model) {
      // VERSI RENTAN:
      // Pesan dari pengguna langsung disatukan ke prompt tanpa validasi atau System Instruction pelindung.
      const prompt = `Pesan Pengguna: ${pesan}\nKonteks Menu: ${JSON.stringify(konteks)}`;

      // Memanggil fungsi model yang disediakan evaluator / LLM
      const resText = await model(prompt);

      let balasan = typeof resText === 'string' ? resText : JSON.stringify(resText);
      let aksi = [];

      // Mengekstrak AKSI jika ada di output model tanpa pemeriksaan otorisasi
      const actionMatches = balasan.match(/AKSI\s*(\{.*?\})/g);
      if (actionMatches) {
        actionMatches.forEach(m => {
          try {
            const rawJson = m.replace(/^AKSI\s*/, '');
            const parsed = JSON.parse(rawJson);
            aksi.push({
              tool: parsed.tool || '',
              status: "dijalankan", // RENTAN: Langsung menjalankan aksi apapun dari model
              ref: parsed.ref || ''
            });
          } catch(e) {}
        });
      }

      return { balasan, aksi };
    };

    async function kirimPesan() {
      const input = document.getElementById('userInput');
      const text = input.value.trim();
      if (!text) return;

      appendMsg(text, 'user');
      input.value = '';

      const dummyMenu = { menu: [{ nama: "Nasi goreng", harga: 12000 }, { nama: "Es teh", harga: 4000 }] };
      const dummyModel = async (p) => "Jawaban simulasi lokal.";

      const res = await window.asisten(text, dummyMenu, dummyModel);
      appendMsg(res.balasan, 'asisten');
    }

    function appendMsg(text, sender) {
      const box = document.getElementById('chatHistory');
      const div = document.createElement('div');
      div.className = `msg ${sender}`;
      div.textContent = text;
      box.appendChild(div);
      box.scrollTop = box.scrollHeight;
    }
  </script>
</body>
</html>
